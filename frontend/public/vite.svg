  <path
    d="M16 19 L28 47 C29.2 49.5 32.8 49.5 34 47 L46 19 C47.2 16.5 45.2 14 42.5 14 L39 14 C37.8 14 36.6 14.8 36.1 16 L31 29.5 L25.9 16 C25.4 14.8 24.2 14 23 14 L19.5 14 C16.8 14 14.8 16.5 16 19 Z"
    fill="#FFFFFF"
  />

  <!-- Sparkle Accent Symbol (Top Right) -->
  <path
    d="M48 9 C48 13.4 51.6 17 56 17 C51.6 17 48 20.6 48 25 C48 20.6 44.4 17 40 17 C44.4 17 48 13.4 48 9 Z"
